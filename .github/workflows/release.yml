name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build twine
      - name: Verify tag matches package and CLI versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['RELEASE_TAG']
          expected = tag.removeprefix('v')
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          source = pathlib.Path('Export-CodexThread.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', source, re.MULTILINE)
          cli = match.group(1) if match else None
          if not expected or expected != project or expected != cli:
              raise SystemExit(f'version mismatch: tag={expected!r}, pyproject={project!r}, cli={cli!r}')
          PY
      - run: python tools/sync_cli.py --check
      - run: python -m build
      - name: Verify distribution archive hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          bad = []
          for artifact in sorted(Path("dist").iterdir()):
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      names = archive.getnames()
              else:
                  continue

              for name in names:
                  normalized = name.replace("\\", "/")
                  if "/__pycache__/" in f"/{normalized}/" or normalized.endswith((".pyc", ".pyo")):
                      bad.append(f"{artifact.name}: {name}")

          if bad:
              raise SystemExit("Generated bytecode found in distributions:\n" + "\n".join(bad))
          print("Distribution archives contain no generated bytecode.")
          PY
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: codex-export --version
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.ref_name }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
