[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-exporter"
version = "0.2.0"
description = "Fidelity-oriented Markdown exports of local OpenAI Codex session JSONL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lowestprime" }]
keywords = ["openai", "codex", "jsonl", "markdown", "transcript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.12,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
codex-export = "codex_exporter.cli:main"

[project.urls]
Homepage = "https://github.com/lowestprime/codex-exporter"
Repository = "https://github.com/lowestprime/codex-exporter"
Issues = "https://github.com/lowestprime/codex-exporter/issues"

[tool.setuptools.packages.find]
include = ["codex_exporter*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
